<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Live-Dashboard für perfect-tracking.com — Positionen, Klassement, Strecken und Ergebnisse." />
    <title>perfect tracking · live dashboard</title>
    <script>
      // Applied before first paint so a dark-mode reload never flashes white.
      (() => {
        const stored = localStorage.getItem("pt-theme");
        const dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
